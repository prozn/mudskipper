name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      # Fetches the network the build embeds, as a local build does, cached on its name.
      - name: Cache network
        uses: actions/cache@v4
        with:
          path: networks
          key: network-${{ hashFiles('network.txt') }}
      - name: Fetch network
        shell: bash
        run: |
          command -v make || choco install make --no-progress
          make net
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (datagen)
        run: cargo clippy --all-targets --locked --features datagen -- -D warnings
      # Runs every test, including datagen's.
      - name: Test
        run: cargo test --locked --features datagen
      - name: Docs
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --locked --features datagen
      # The normal release build, without datagen, is built by the bench job.
      - name: Build (datagen)
        run: cargo build --release --locked --features datagen
      - name: Makefile build
        shell: bash
        run: make EXE=mudskipper-ci
      # A network file of the wrong size must fail the build, not load garbage.
      - name: Wrong-size network fails
        if: runner.os == 'Linux'
        shell: bash
        run: |
          head -c 1024 networks/default.bin > "$RUNNER_TEMP/short.bin"
          if EVALFILE="$RUNNER_TEMP/short.bin" cargo check --locked 2> "$RUNNER_TEMP/check.log"; then
            echo "::error::a build with a 1024-byte network succeeded"
            exit 1
          fi
          grep "wrong size" "$RUNNER_TEMP/check.log"

  # Checks the Bench signature in the head commit message. Runs on Windows too, so the
  # two platforms must agree with the commit and therefore with each other.
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # A pull request's default checkout is a merge commit; check the branch head, whose
      # message carries the `Bench:` line.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install toolchain
        run: rustup toolchain install
      # Fetches the network the build embeds, as a local build does, cached on its name.
      - name: Cache network
        uses: actions/cache@v4
        with:
          path: networks
          key: network-${{ hashFiles('network.txt') }}
      - name: Fetch network
        shell: bash
        run: |
          command -v make || choco install make --no-progress
          make net
      - name: Build
        run: cargo build --release --locked
      - name: Check Bench signature
        shell: bash
        run: |
          engine=target/release/mudskipper
          [[ -f $engine.exe ]] && engine=$engine.exe
          .github/scripts/check-bench.sh "$engine"
