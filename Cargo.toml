[package]
name = "mudskipper"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A UCI chess engine"
license = "GPL-3.0-or-later"
repository = "https://github.com/prozn/mudskipper"
readme = "README.md"
publish = false

# No runtime dependencies (ADR-0005).
[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Engine code converts between squares, indices, scores and counters constantly;
# these casts are deliberate and bounds are checked where they matter.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# Chess code is full of short, conventional names (sq, bb, us, them).
similar_names = "allow"
# Search and move generation functions are long by nature; splitting them hurts readability.
too_many_lines = "allow"
